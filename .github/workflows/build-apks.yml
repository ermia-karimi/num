
name: Build Numix Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'persian/**'
      - 'international/**'
      - '.github/workflows/build-apks.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.edition }} Release
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: persian
            apk_artifact: Numix-Persian-Release-APK
            aab_artifact: Numix-Persian-Release-AAB
          - edition: international
            apk_artifact: Numix-International-Release-APK
            aab_artifact: Numix-International-Release-AAB

    defaults:
      run:
        working-directory: ${{ matrix.edition }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Generate Numix App Icons
        run: |
          npx --yes @capacitor/assets@4 generate --android --assetPath ./www/resources --iconBackgroundColor '#101A4C' --splashBackgroundColor '#101A4C'

      - name: Copy web assets
        run: npx cap sync android

      - name: Prepare Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.Secret1 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/numix-release.jks
          test -s android/app/numix-release.jks

      - name: Configure Android Release Signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          content = path.read_text()

          signing = """
              signingConfigs {
                  release {
                      storeFile file("numix-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

          """

          if "signingConfigs {" not in content:
              if "    buildTypes {" not in content:
                  raise SystemExit("Could not find buildTypes in build.gradle")
              content = content.replace(
                  "    buildTypes {",
                  signing + "    buildTypes {",
                  1
              )

          release_marker = "        release {"
          if release_marker not in content:
              raise SystemExit("Could not find release build type")

          if "signingConfig signingConfigs.release" not in content:
              content = content.replace(
                  release_marker,
                  release_marker + "\n            signingConfig signingConfigs.release",
                  1
              )

          path.write_text(content)
          print("Release signing configured successfully.")
          PY

      - name: Build Signed Release APK and AAB
        working-directory: ${{ matrix.edition }}/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.Secret2 }}
          ANDROID_KEY_ALIAS: ${{ secrets.Secret3 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.Secret4 }}
        run: |
          ./gradlew assembleRelease bundleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.apk_artifact }}
          path: ${{ matrix.edition }}/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.aab_artifact }}
          path: ${{ matrix.edition }}/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
