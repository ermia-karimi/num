
name: Build Numix APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'persian/**'
      - 'international/**'
      - '.github/workflows/build-apks.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.edition }} APK
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: persian
            artifact: Numix-Persian-APK
          - edition: international
            artifact: Numix-International-APK

    defaults:
      run:
        working-directory: ${{ matrix.edition }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Copy web assets to Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ${{ matrix.edition }}/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.edition }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
